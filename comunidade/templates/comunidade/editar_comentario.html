{% extends 'base.html' %}

{% block titulo %}Editar comentário — Curso Solução{% endblock %}

{% block conteudo %}
<p><a href="{% url 'post_detalhe' comentario.post.pk %}">&larr; Voltar para o post</a></p>

<h1>Editar comentário</h1>
<p style="color:var(--cinza); margin-bottom:1.2rem;">Em "{{ comentario.post.titulo }}"</p>

<div class="cartao">
    <form method="post">
        {% csrf_token %}
        <p><textarea name="texto" rows="4" required>{{ comentario.texto }}</textarea></p>
        <button type="submit" class="botao">Salvar alterações</button>
    </form>
</div>
{% endblock %}
