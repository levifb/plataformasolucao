{% extends 'base.html' %}

{% block titulo %}Editar comentário — Curso Solução{% endblock %}

{% block conteudo %}
<a class="voltar" href="{% url 'post_detalhe' comentario.post.pk %}">&larr; Voltar para o post</a>

<h1>Editar comentário<span class="qed" aria-hidden="true"></span></h1>
<p class="sub">Em "{{ comentario.post.titulo }}"</p>

<div class="cartao">
    <form method="post">
        {% csrf_token %}
        <p><textarea name="texto" rows="4" required>{{ comentario.texto }}</textarea></p>
        <button type="submit" class="botao">Salvar alterações</button>
    </form>
</div>
{% endblock %}
