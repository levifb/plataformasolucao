<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Curso Solução{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
<header class="topo">
    <div class="topo-conteudo">
        <a href="{% url 'home' %}" class="marca">
            <img src="{% static 'img/logosolucao.png' %}" alt="Curso Solução">
        </a>
        {% if user.is_authenticated %}
        <nav class="menu">
            <a href="{% url 'home' %}" {% if '/comunidade/' not in request.path %}class="ativo"{% endif %}>Aulas</a>
            <a href="{% url 'comunidade' %}" {% if '/comunidade/' in request.path %}class="ativo"{% endif %}>Comunidade</a>
            <form method="post" action="{% url 'logout' %}" class="form-sair">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        </nav>
        {% endif %}
    </div>
</header>

<main class="conteudo">
    {% block conteudo %}{% endblock %}
</main>

<footer class="rodape">
    Curso Solução — Olimpíadas de Matemática
</footer>
</body>
</html>
