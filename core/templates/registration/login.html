{% extends 'base.html' %}

{% block titulo %}Entrar — Curso Solução{% endblock %}

{% block conteudo %}
{% load static %}
<div class="caixa-login">
    <div class="login-logo">
        <img src="{% static 'img/logosolucao.png' %}" alt="Curso Solução">
    </div>
    <h1>Bem-vindo(a)!</h1>
    <p class="login-marca">Plataforma do aluno</p>

    {% if form.errors %}
    <p class="erros">Email ou senha incorretos. Tente novamente.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_username">Email</label>
            <input type="email" name="username" id="id_username" required autofocus>
        </p>
        <p>
            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" required>
        </p>
        <button type="submit" class="botao">Entrar</button>
    </form>
</div>
{% endblock %}
