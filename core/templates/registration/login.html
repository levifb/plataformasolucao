{% extends 'base.html' %}

{% block titulo %}Entrar — Curso Solução{% endblock %}

{% block conteudo %}
{% load static %}
<div class="caixa-login">
    <div class="login-logo">
        <img src="{% static 'img/logosolucao.png' %}" alt="Curso Solução">
    </div>
    <div class="login-corpo">
        <p class="login-marca">Plataforma do aluno</p>
        <h1>Bem-vindo(a)<span class="qed" aria-hidden="true"></span></h1>

        {% if form.errors %}
        <p class="erros">Email ou senha incorretos. Tente novamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_username">Email</label>
                <input type="email" name="username" id="id_username" required autofocus>
            </p>
            <p>
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" required>
            </p>
            <button type="submit" class="botao">Entrar</button>
        </form>

        <p class="login-links"><a href="{% url 'password_reset' %}">Esqueci minha senha</a></p>
    </div>
</div>
{% endblock %}
